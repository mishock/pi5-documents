; GEM e6 BMC эмулятор — PB MCU01 H503A (STM32H503CB)
[platformio]
boards_dir = boards
default_envs = generic_h503cbtx

[env:generic_h503cbtx]
platform = ststm32
board = generic_h503cbtx
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
debug_tool = stlink
build_flags =
  -DHAL_FDCAN_MODULE_ENABLED
  -DARDUINO_GENERIC_H503CBTX
  -DPIN_SERIAL_TX=PA9
  -DPIN_SERIAL_RX=PA10
  -DUSBD_VID=0x0483
  -DUSBD_PID=0x5740
