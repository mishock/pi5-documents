homeassistant:
  packages: !include_dir_named packages

frontend:
  extra_module_url:
    - /local/card-mod.js?v=4.2.1
config:
history:
logbook:
map:
ssdp:
zeroconf:
sun:
system_health:
mobile_app:
# Живое видео камер (HLS/WebRTC) — нужно для camera.elektrotsekh (Hikvision, RTSP).
stream:

# Температура CPU Pi5. Значения публикует systemd timer pi5-ha-cpu-temp.timer
# (scripts/publish_cpu_temp.sh → config/host_status/cpu_temp.txt) каждые 5 минут.
# Не ставить путь с пробелами в cron без кавычек — иначе файл не обновляется.
recorder:
  purge_keep_days: 30
  exclude:
    domains:
      - sun

command_line:
  - sensor:
      name: "Pi5 CPU Temperature"
      unique_id: pi5_cpu_temp
      command: "cat /config/host_status/cpu_temp.txt 2>/dev/null || echo 0"
      unit_of_measurement: "°C"
      device_class: temperature
      scan_interval: 300

homekit:
  - name: HASS Bridge
    pincode: 126-30-126
    port: 21064
    ip_address: 0.0.0.0
    advertise_ip: 10.1.30.126
    filter:
      include_entities:
        - switch.switch_2
        - switch.led2_2
        # switch.gpio13 отключён: BCM 13 = пищалка многофункциональной HAT
  # ВНИМАНИЕ: рабочий мост «HASS Bridge:21064» создан через UI (source=user) —
  # этот YAML к нему НЕ применяется. Состав моста (камера электроцеха и т.д.)
  # меняется в UI: Настройки → Интеграции → HomeKit Bridge → Настроить.

lovelace:
  mode: storage
  dashboards:
    pi5-monitor:
      mode: yaml
      title: Pi 5
      icon: mdi:raspberry-pi
      show_in_sidebar: true
      filename: dashboards/pi5.yaml
    ant-bms-24c:
      mode: yaml
      title: ANT BMS24C
      icon: mdi:car-battery
      show_in_sidebar: true
      filename: dashboards/ant-bms-24c.yaml
    jk-akb-4s-230:
      mode: yaml
      title: JK АКБ 4S 230Ah
      icon: mdi:battery-high
      show_in_sidebar: true
      filename: dashboards/jk-akb-4s-230.yaml

