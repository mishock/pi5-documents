title: Pi 5
views:
  - title: Мониторинг
    path: monitor
    icon: mdi:raspberry-pi
    cards:
      - type: markdown
        content: |
          ## Raspberry Pi 5 — температура CPU
          Обновление каждые 5 минут · история до 30 суток.

      - type: gauge
        entity: sensor.pi5_cpu_temperature
        name: CPU
        unit: "°C"
        min: 30
        max: 85
        needle: true
        severity:
          green: 30
          yellow: 65
          red: 75

      - type: history-graph
        title: Температура CPU — 24 часа
        hours_to_show: 24
        refresh_interval: 300
        entities:
          - entity: sensor.pi5_cpu_temperature
            name: CPU Pi 5

      - type: history-graph
        title: Температура CPU — 30 суток
        hours_to_show: 720
        refresh_interval: 600
        entities:
          - entity: sensor.pi5_cpu_temperature
            name: CPU Pi 5
