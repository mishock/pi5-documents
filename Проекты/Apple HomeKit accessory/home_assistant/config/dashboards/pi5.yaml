title: Pi 5
views:
  - title: Мониторинг
    path: monitor
    icon: mdi:raspberry-pi
    cards:
      - type: markdown
        content: |
          ## Raspberry Pi 5 — температура CPU
          Обновление каждые 5 минут · история до 30 суток.

      - type: gauge
        entity: sensor.pi5_cpu_temperature
        name: CPU
        unit: "°C"
        min: 30
        max: 85
        needle: true
        severity:
          green: 30
          yellow: 65
          red: 75

      - type: history-graph
        title: Температура CPU — 24 часа
        hours_to_show: 24
        refresh_interval: 300
        entities:
          - entity: sensor.pi5_cpu_temperature
            name: CPU Pi 5

      - type: history-graph
        title: Температура CPU — 30 суток
        hours_to_show: 720
        refresh_interval: 600
        entities:
          - entity: sensor.pi5_cpu_temperature
            name: CPU Pi 5

  - title: ANT 24C
    path: ant24c
    icon: mdi:car-battery
    cards:
      - type: markdown
        content: |
          ## BMS-ANT24C — пакет
          Лог с Pi каждые 10 с. График общего напряжения: разряд вниз, заряд вверх, отсечка по MOS.
          Зарядный MOS в OV protect не включится, пока ячейки не опустятся ниже восстановления (~4.150 В).

      - type: entities
        title: Управление
        entities:
          - entity: switch.ant24c_charge_mosfet
            name: Зарядный MOS
          - entity: sensor.ant24c_charge_mos
            name: Статус заряда
          - entity: switch.ant24c_discharge_mosfet
            name: Разрядный MOS
          - entity: sensor.ant24c_discharge_mos
            name: Статус разряда
          - entity: switch.ant24c_balancer
            name: Балансир
          - entity: sensor.ant24c_balancer
            name: Статус балансира

      - type: entities
        title: Сейчас
        entities:
          - entity: sensor.ant24c_pack_voltage
            name: Напряжение пакета
          - entity: sensor.ant24c_current
            name: Ток (− заряд / + разряд)
          - entity: sensor.ant24c_soc
            name: SOC
          - entity: sensor.ant24c_mode
            name: Режим
          - entity: sensor.ant24c_charge_mos
            name: Зарядный MOS
          - entity: sensor.ant24c_discharge_mos
            name: Разрядный MOS
          - entity: sensor.ant24c_balancer
            name: Балансир

      - type: entities
        title: До какого напряжения
        entities:
          - entity: sensor.ant24c_last_charge_peak
            name: Пик заряда (когда отсекла)
          - entity: sensor.ant24c_last_discharge_floor
            name: Пол разряда (когда отсекла)
          - entity: sensor.ant24c_voltage_max_seen
            name: Максимум за всё время лога
          - entity: sensor.ant24c_voltage_min_seen
            name: Минимум за всё время лога

      - type: gauge
        entity: sensor.ant24c_pack_voltage
        name: Пакет
        unit: V
        min: 39
        max: 55
        needle: true
        severity:
          red: 39
          yellow: 46
          green: 50

      - type: history-graph
        title: Напряжение пакета — 24 часа
        hours_to_show: 24
        refresh_interval: 30
        entities:
          - entity: sensor.ant24c_pack_voltage
            name: Пакет V

      - type: history-graph
        title: Ток — 24 часа
        hours_to_show: 24
        refresh_interval: 30
        entities:
          - entity: sensor.ant24c_current
            name: Ток A

      - type: history-graph
        title: SOC — 24 часа
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.ant24c_soc
            name: SOC

      - type: history-graph
        title: Напряжение пакета — 7 суток
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: sensor.ant24c_pack_voltage
            name: Пакет V
